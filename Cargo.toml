[package]
name = "pixel_pet"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A tiny desktop pixel pet that reacts to your Claude Code usage"

[dependencies]
serde_json = "1"
gif = "0.13"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
